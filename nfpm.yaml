name: wiremark
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Vidhu Sarwal <vidhusarwal@hotmail.com>
description: |
  Record a real HTTP request and the Redis calls behind it, then replay
  the same interaction later without Redis running.
vendor: Wiremark
homepage: https://github.com/VidhuSarwal/wiremark
license: Apache-2.0
contents:
  - src: dist/wiremark-bin
    dst: /usr/bin/wiremark
    file_info:
      mode: 0755
